<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Compras</title>
<meta name="theme-color" content="#1F3B34">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compras">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F3F0; --surface:#FFFFFF; --surface-2:#FAF8F6; --ink:#17201E; --muted:#5D6865; --line:#E3DFDA;
  --accent:#BE4A2F; --on-accent:#FFFFFF; --nori:#1F3B34; --nori-soft:#E3EDE9;
  --good:#2E7A4E; --good-soft:#E2F2E8; --warn:#9A6200; --warn-soft:#FBF0D9; --bad:#B3261E; --bad-soft:#FBE4E2;
  --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif; --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101513; --surface:#19201E; --surface-2:#151B19; --ink:#ECEFED; --muted:#9BA7A3; --line:#2B3532;
  --accent:#F08B6D; --on-accent:#1C0F0A; --nori:#A3CDBF; --nori-soft:#1E2E29;
  --good:#6CC690; --good-soft:#18301F; --warn:#E5B24E; --warn-soft:#33280F; --bad:#F2877E; --bad-soft:#3A1C1A; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 2px}
.brand h1{font-family:var(--f-display);font-size:21px;margin:0;letter-spacing:-.01em}
.menu{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:10px 12px;border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{background:var(--accent);color:var(--on-accent);font-size:11px;border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
main{padding-block:16px 120px}
h2{font-family:var(--f-display);font-size:20px;margin:0 0 4px;text-wrap:balance}
h3{font-size:16px;margin:0}
.lead{color:var(--muted);margin:0 0 14px;max-width:62ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)} small{font-size:12.5px} .num{font-variant-numeric:tabular-nums}
.banner{padding:10px 12px;border-radius:10px;background:var(--warn-soft);border:1px solid var(--line);font-size:14px}
.alert{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:700;text-decoration:none;margin-top:12px}
.empty{padding:22px 18px} .empty h3{font-family:var(--f-display);font-size:18px;margin-bottom:6px}
button,.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:42px}
button:hover,.btn:hover{border-color:var(--muted)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.good{background:var(--good);border-color:var(--good);color:var(--surface)}
button.danger{color:var(--bad)} button:disabled{opacity:.5;cursor:not-allowed}
button.small,.btn.small{min-height:34px;padding:5px 10px;font-size:13px}
button.link{border:0;background:none;color:var(--muted);text-decoration:underline;min-height:30px;padding:2px 4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:42px;width:100%}
textarea{min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
#shopbar{padding-block:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;min-height:34px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--nori);border-color:var(--nori);color:var(--surface)}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prod>header{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:12px 14px 8px}
.cat{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;white-space:nowrap}
.offers{list-style:none;margin:0;padding:0}
.offer{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.offer.best{background:var(--good-soft)}
.offer .sup b{display:block;font-size:14.5px} .offer .sup small{color:var(--muted);display:block;overflow-wrap:anywhere}
.price{text-align:right;font-variant-numeric:tabular-nums} .price b{display:block;font-size:16px} .price small{color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.stag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--nori-soft);color:var(--nori);margin-left:4px;vertical-align:1px;white-space:nowrap}
#sitebar{margin-bottom:8px}
.srow{display:flex;gap:8px;align-items:stretch}.srow input{flex:1;min-width:0}
#supBtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;max-width:48%;font-weight:600;border-radius:9px}
#supBtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#supBtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mback{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.msheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.msheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.msheet h3{margin:0}
.sopt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:6px;min-height:46px;font-weight:600}
.sopt[aria-pressed="true"]{border-color:var(--accent);background:var(--nori-soft)}
.sopt small{color:var(--muted);font-weight:500;white-space:nowrap}
#sitebar .chip{font-size:14px;min-height:38px;padding:6px 14px;color:var(--ink)}
#sitebar .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tag.best{background:var(--good);color:var(--surface)} .tag.up{background:var(--bad-soft);color:var(--bad)} .tag.down{background:var(--good-soft);color:var(--good)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;border-radius:0;min-height:38px;min-width:38px;padding:0;justify-content:center;font-size:18px}
.stepper span{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:520px){.offer{grid-template-columns:minmax(0,1fr) auto}.offer .addcell{grid-column:1 / -1;justify-self:end}}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px;background:linear-gradient(to top,var(--bg) 60%,transparent)}
.cartbar a{display:flex;justify-content:space-between;align-items:center;background:var(--nori);color:var(--surface);border-radius:14px;padding:13px 16px;text-decoration:none;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.group>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.items{list-style:none;margin:0;padding:0}
.items li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.items li small{color:var(--muted);display:block}
.group>footer{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.total{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums}
.status{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.st-pendente{background:var(--warn-soft);color:var(--warn)} .st-aprovada{background:var(--nori-soft);color:var(--nori)}
.st-enviada{background:var(--good-soft);color:var(--good)} .st-rejeitada{background:var(--bad-soft);color:var(--bad)}
pre.msg{white-space:pre-wrap;background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:12px;margin:0;font-family:var(--f-body);font-size:14px}
details.sec>summary{cursor:pointer;font-weight:700;padding:6px 0;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:18px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:84px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.line{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.line.off{opacity:.55}
.line-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.calc{font-weight:700;font-variant-numeric:tabular-nums}
.pchk{display:block;margin-top:4px;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600}
.pchk.up{background:var(--warn-soft);color:var(--warn)}.pchk.down{background:var(--good-soft);color:var(--good)}.pchk.odd{background:var(--bad-soft);color:var(--bad)}
.spinner{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th,table.list td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.list th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.scroll{overflow-x:auto}
.prow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 90px;gap:8px;align-items:end}
@media (max-width:560px){.prow{grid-template-columns:1fr 1fr}.prow .wide{grid-column:1 / -1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}
.login h1{font-family:var(--f-display);font-size:30px;margin:0}
.pin{letter-spacing:.4em;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
/* ---- v2: mais limpo ---- */
#appView{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
.brand{padding-block:10px}
.brand h1{font-size:18px}
main{padding-block:8px 24px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);gap:0;justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav.tabs a{flex:1 1 0;min-width:0;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;border-bottom:0;position:relative}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a{max-width:150px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs .count{position:absolute;top:1px;left:calc(50% + 5px);font-size:10px;padding:0 5px;line-height:16px}
.cartbar{display:none!important}
#shopbar{position:sticky;top:0;z-index:4;background:var(--bg);padding-block:10px 6px}
#sitebar.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:8px}
#sitebar.seg .chip{border:0;border-radius:9px;background:none;min-height:36px;padding:4px 2px;font-size:13.5px;justify-content:center;color:var(--muted)}
#sitebar.seg .chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
#sitebar .sc{display:inline-block;min-width:16px;font-size:10.5px;line-height:16px;border-radius:999px;background:var(--nori);color:var(--surface);margin-left:4px}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pitem{padding:10px 12px;border-top:1px solid var(--line)}
.pitem:first-child{border-top:0}
.pl{display:flex;align-items:center;gap:10px}
.pinfo{flex:1;min-width:0}
.pname{font-weight:700;font-size:15px;line-height:1.25}
.psub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.psub b{color:var(--ink);font-variant-numeric:tabular-nums}
.addbtn{width:40px;height:40px;min-height:40px;border-radius:50%;padding:0;justify-content:center;font-size:22px;line-height:1;flex:0 0 auto}
.pl .stepper{flex:0 0 auto}
.more{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;min-height:26px;padding:4px 0 0;text-decoration:underline}
.alt{margin-top:8px;padding-left:10px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.edit{border:0;background:none;min-height:0;padding:0 0 0 6px;font-size:12px;color:var(--muted);text-decoration:underline;font-weight:600}
.group>header{padding:10px 12px}
.items li{padding:8px 12px}
details.msgbox>summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
details.msgbox pre{margin-top:8px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btnrow .btn,.btnrow button{justify-content:center}
.full{width:100%;justify-content:center}
#pendAlert{display:none!important}
.items li:last-child{border-bottom:0}
.group>footer{border-top:1px solid var(--line)}
.menu{white-space:nowrap;gap:2px} .menu .link{font-size:13px}
.edit{text-decoration:none;font-size:14px}
.minw{color:var(--warn);font-weight:600;font-size:13px}
.oki{color:var(--good);font-weight:700;font-size:13px}
.stickysub{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.12);margin-top:6px}
.stickysub b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
details.more2>summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
/* sem zoom */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
.stepper .qin{width:44px;min-height:38px;border:0;border-radius:0;padding:0;text-align:center;font-weight:700;background:transparent;font-variant-numeric:tabular-nums}
.stepper .qu{font-size:12px;color:var(--muted);margin:0 2px 0 -4px}
.pico{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:var(--nori-soft);display:flex;align-items:center;justify-content:center;font-size:21px}
.pname{font-size:16px}
.psub b{font-size:15px}
.pitem.incart{background:var(--nori-soft)}

@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

.habh{margin:14px 0 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pbar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--warn);border-radius:99px;transition:width .3s}
.pbar.ok i{background:var(--good)}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:700;min-height:0;padding:0 0 0 12px}

.sumc small{color:var(--muted)}

.ohead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.group.closed>header{border-bottom:0}
.group.ocard{box-shadow:0 3px 12px rgba(31,59,52,.14),0 1px 3px rgba(0,0,0,.08)}
.group.ocard.closed{box-shadow:0 2px 8px rgba(31,59,52,.12),0 1px 2px rgba(0,0,0,.06)}

<body>
<div id="loginView" class="wrap" hidden>
  <form class="login" id="loginForm" autocomplete="on">
    <h1>Compras</h1>
    <p class="muted" style="margin:0">Entre com o seu nome e o PIN de 6 números que o chefe lhe deu.</p>
    <label class="f">Nome<input id="lgNome" name="username" autocomplete="username" required autocapitalize="words"></label>
    <label class="f">PIN<input id="lgPin" class="pin" name="password" type="password" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="current-password" required></label>
    <button class="primary" type="submit" id="lgBtn">Entrar</button>
    <p class="banner" id="lgMsg" hidden></p>
  </form>
</div>

<div id="appView" hidden>
  <header class="top">
    <div class="wrap">
      <div class="brand"><h1 id="rname">Compras</h1>
        <div class="menu"><span id="who"></span><button class="link" data-action="pin-form">PIN</button><button class="link" data-action="logout">Sair</button></div></div>
      <nav class="tabs" aria-label="Secções">

<script>
(function(){
"use strict";
const SB = "https://cckgrpmspyurgmbgtjdu.supabase.co";
const KEY = "sb_publishable_Wx2OTwxuvML3D9D-xcHtpQ_URAzL_vW";
const CATS = ["Peixe e marisco","Carne","Legumes e fruta","Mercearia","Bebidas","Limpeza e higiene","Descartáveis","Outros"];
const UNITS = ["un","kg","L"];
const CAT_ICON = {"Peixe e marisco":"🐟","Carne":"🥩","Legumes e fruta":"🥬","Mercearia":"🥫","Bebidas":"🥤","Limpeza e higiene":"🧽","Descartáveis":"📦","Outros":"🛒"};
function lev(a, b){ const m = a.length, n = b.length; if (!m) return n; if (!n) return m; let prev = Array.from({length:n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++){ const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; } return prev[n]; }
const SETORES = [["cozinha","Cozinha"],["sushi","Sushi"],["bar","Bar"],["takeaway","Take away"]];
const shortSup = n => { const s = String(n || "").split(/\s[-–]\s|,/)[0].replace(/\s+(lda|unip|unipessoal|s\.?a)\.?$/i, "").trim(); return s.length > 22 ? s.slice(0, 21) + "…" : s; };
const unitInfo = (pq, bu, pp) => Number(pq) !== 1 ? `${packLabel(pq, bu || "un")} · ${eur(pp)}` : `${eur(pp)}/${bu || "un"}`;
const setorNome = k => (SETORES.find(x => x[0] === k) || [null, ""])[1];

// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => (Number(n) || 0).toLocaleString("pt-PT", {style:"currency", currency:"EUR"});

const parseNum = v => { if (typeof v === "number") return v; const s = String(v ?? "").trim().replace(/\s/g,"").replace("€",""); if (!s) return NaN; return s.includes(",") ? parseFloat(s.replace(/\./g,"").replace(",",".")) : parseFloat(s); };
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const fmtDate = iso => iso && /^\d{4}-\d{2}-\d{2}/.test(iso) ? iso.slice(8,10) + "/" + iso.slice(5,7) + "/" + iso.slice(2,4) : "";
const fmtDT = iso => { if (!iso) return ""; const d = new Date(iso); return d.toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit"}) + " " + d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}); };
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
const digits = s => String(s || "").replace(/\D/g, "");
const ls = {get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} }};
function packLabel(q, bu){ q = Number(q) || 1; return q !== 1 ? "emb. " + num(q, 3) + " " + bu : bu; }
function waPhone(p){ let d = digits(p); if (d.startsWith("00")) d = d.slice(2); if (d.length === 9) d = "351" + d; return d; }
function undoToast(msg, prev){ const el = $("#toast"); el.textContent = msg + " "; const b = document.createElement("button"); b.textContent = "Desfazer"; b.dataset.action = "undo-cart"; el.appendChild(b); S.undo = prev; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; S.undo = null; }, 6000); }
let toastT; function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3800); }

const ERR = {
  sessao_invalida:"A sessão terminou. Entre outra vez.", sem_permissao:"Só o chefe pode fazer isto.", pin_errado:"O PIN atual está errado.",
  pin_formato:"O PIN tem de ter exatamente 6 números.", nome_obrigatorio:"Falta o nome.", nao_pode_proprio:"Não pode tirar a si próprio o acesso de chefe.",
  carrinho_vazio:"O carrinho está vazio.", preco_invalido:"Preço inválido.", estado_invalido:"Ação inválida.", login_invalido:"Nome ou PIN errados.",
  bloqueado:"Demasiadas tentativas. Espere 15 minutos ou peça ao chefe para repor o PIN."
};
const errMsg = e => { const m = (e && e.message) || ""; if (/duplicate key/.test(m)) return "Já existe alguém com esse nome."; return ERR[m] || "Algo correu mal. Tente outra vez."; };

async function rpc(fn, args){
  let r;
  try { r = await fetch(SB + "/rest/v1/rpc/" + fn, {method:"POST", headers:{apikey:KEY, "Content-Type":"application/json"}, body:JSON.stringify(args || {})}); }
  catch(e){ S.offline = true; throw new Error("rede"); }
  S.offline = false;
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch(e){}
  if (!r.ok) { const m = (j && j.message) || "erro"; if (m === "sessao_invalida") { endSession(true); } throw new Error(m); }
  return j;
}

// ---------- state ----------
const S = {
  token: ls.get("cf_token", null), me:null, products:[], suppliers:[], orders:[], pend:0,
  view:"encomendar", search:"", cat:"", cart: ls.get("cf_cart", {}),
  edits:{}, deliv:{}, files:[], previews:[], reading:null, readMsg:"", review:null, saving:false,
  users:[], invoices:[], confirmDel:null, pinForm:false, drafts:[], queueing:false, setor:"cozinha", todos:false, sup:"", supOpen:false, pop:null, undo:null, offline:false, openOrd:{}
};
const inSite = p => !(p.setores || []).length || p.setores.includes(S.setor);
const isChefe = () => S.me && S.me.role === "chefe";

const prodById = id => S.products.find(p => p.id === id);
function saveCart(){ ls.set("cf_cart", S.cart); }
function cartEntries(){
  return Object.entries(S.cart).map(([k, qty]) => {
    const [pid, sid, setor] = k.split("|"); const p = prodById(pid); const o = p && p.offers.find(x => x.supplier_id === sid);
    return p && o && qty > 0 ? {key:k, pid, sid, setor:setor || S.setor, qty, p, o} : null;
  }).filter(Boolean);
}
const itemsTotal = items => items.reduce((t, it) => t + (Number(it.qty)||0) * (Number(it.pack_price)||0), 0);

// ---------- session ----------
function endSession(expired){
  if (S.token) rpc("compras_logout", {p_token:S.token}).catch(() => {});
  S.token = null; S.me = null; ls.del("cf_token"); ls.del("cf_me"); ls.del("cf_cat");
  $("#appView").hidden = true; $("#loginView").hidden = false;
  if (expired) { const m = $("#lgMsg"); m.textContent = ERR.sessao_invalida; m.hidden = false; }
  try { navigator.clearAppBadge && navigator.clearAppBadge(); } catch(e){}
}
$("#loginForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = $("#lgBtn"), msg = $("#lgMsg"); btn.disabled = true; msg.hidden = true;
  try {
    const r = await rpc("compras_login", {p_nome:$("#lgNome").value, p_pin:$("#lgPin").value});
    if (r.error) { msg.textContent = ERR[r.error] || "Não foi possível entrar."; msg.hidden = false; return; }
    S.token = r.token; ls.set("cf_token", r.token); $("#lgPin").value = "";
    await start();
  } catch(e){ msg.textContent = e.message === "rede" ? "Sem ligação à internet." : errMsg(e); msg.hidden = false; }
  finally { btn.disabled = false; }
});

async function start(){
  try { S.me = await rpc("compras_me", {p_token:S.token}); ls.set("cf_me", S.me); }
  catch(e){ const cm = e.message === "rede" ? ls.get("cf_me", null) : null;
    if (cm) S.me = cm;
    else { if (e.message !== "sessao_invalida") { $("#loginView").hidden = false; const m = $("#lgMsg"); m.textContent = "Sem ligação. Tente outra vez."; m.hidden = false; } return; } }
  $("#loginView").hidden = true; $("#appView").hidden = false;
  document.querySelectorAll("[data-chefe]").forEach(el => el.hidden = !isChefe());
  $("#who").textContent = S.me.nome;
  const ks = SETORES.map(x => x[0]); const saved = ls.get("cf_setor", null);
  S.setor = ks.includes(saved) ? saved : (ks.includes(S.me.setor) ? S.me.setor : "cozinha");
  for (const k of Object.keys(S.cart)) if (k.split("|").length === 2) { S.cart[k + "|" + S.setor] = (S.cart[k + "|" + S.setor] || 0) + S.cart[k]; delete S.cart[k]; }
  saveCart();
  await Promise.all([loadCatalog(), loadOrders()]);
  if (isChefe()) { loadInvoices(); await loadDrafts(); }

}
let draftTimer = null;

  if (!isChefe()) return;

  if (S.drafts.some(d => d.status === "a_ler")) draftTimer = setTimeout(async () => { const before = S.drafts.filter(d => d.status === "pronta").length; await loadDrafts(); if (S.drafts.filter(d => d.status === "pronta").length > before) toast("Fatura lida. Está pronta a rever."); schedule(); }, 5000);
}
async function loadCatalog(){
  try { const c = await rpc("compras_catalog", {p_token:S.token}); S.products = c.products || []; S.suppliers = c.suppliers || []; S.me.restaurante = c.restaurante; ls.set("cf_cat", c); }
  catch(e){ if (!S.products.length) { const c = ls.get("cf_cat", null); if (c) { S.products = c.products || []; S.suppliers = c.suppliers || []; S.me.restaurante = c.restaurante; } } }
}
async function loadOrders(){
  try {
    const o = await rpc("compras_orders", {p_token:S.token});
    S.orders = o.orders || []; S.pend = o.pendentes || 0;
    try { if (isChefe() && navigator.setAppBadge) { S.pend ? navigator.setAppBadge(S.pend) : navigator.clearAppBadge(); } } catch(e){}
  } catch(e){}
}
async function loadInvoices(){ try { S.invoices = await rpc("compras_invoices_list", {p_token:S.token}) || []; } catch(e){} }
async function loadUsers(){ try { S.users = await rpc("compras_users_list", {p_token:S.token}) || []; } catch(e){} }

// auto refresh: orders every 30 s, catalog every 5 min, when visible
setInterval(async () => { if (!S.me || document.hidden) return; const before = S.pend; await loadOrders(); if (isChefe() && S.pend > before) toast("Nova encomenda por confirmar."); schedule(); }, 30000);
setInterval(async () => { if (!S.me || document.hidden) return; await loadCatalog(); schedule(); }, 300000);
document.addEventListener("visibilitychange", async () => { if (!document.hidden && S.me) { await Promise.all([loadOrders(), loadCatalog(), loadDrafts()]); schedule(); } });

// ---------- render ----------
let queued = false, deferred = false;
function schedule(){
  if (queued) return; queued = true;
  requestAnimationFrame(() => {
    queued = false; const a = document.activeElement;
    if (a && a.closest && a.closest("#view") && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.type !== "file") { deferred = true; chrome(); return; }
    render();
  });
}
document.addEventListener("focusout", () => { if (deferred) { deferred = false; setTimeout(schedule, 0); } });
function route(){
  const h = (location.hash || "").slice(1);
  const ok = ["encomendar","carrinho","pedidos"].concat(isChefe() ? ["faturas","gestao"] : []);
  S.view = ok.includes(h) ? h : "encomendar";
  if (S.view !== "encomendar") S.editProd = null;
  if (S.view === "gestao") loadUsers().then(schedule);
  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { if (S.me) route(); });
window.addEventListener("online", async () => { if (!S.me) return; await Promise.all([loadCatalog(), loadOrders()]); schedule(); });

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));

function chrome(){
  const rn = (S.me && S.me.restaurante) || "";
  $("#rname").textContent = rn || "Compras";
  document.title = (isChefe() && S.pend ? "(" + S.pend + ") " : "") + "Compras" + (rn ? " " + rn : "");
  document.querySelectorAll("nav.tabs a").forEach(a => { const on = a.dataset.view === S.view; on ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"); });
  const c = $("#cntPend"); const n = isChefe() ? S.pend : S.orders.filter(o => o.status === "aprovada" || o.status === "pendente").length;
  c.hidden = !n; c.textContent = n;
  const dr = S.drafts.filter(d => d.status === "pronta").length; const cd = $("#cntDraft"); cd.hidden = !dr; cd.textContent = dr;
  const al = $("#pendAlert"); al.hidden = !(isChefe() && S.pend && S.view !== "pedidos");
  al.innerHTML = `<span>${S.pend} ${S.pend === 1 ? "encomenda por confirmar" : "encomendas por confirmar"}</span><span>Ver →</span>`;

  const ents = cartEntries(); const bar = $("#cartbar");
  $("#sitebar").innerHTML = SETORES.map(([k, n]) => { const c = ents.filter(e => e.setor === k).length;
    return `<button class="chip" data-action="setor" data-s="${k}" aria-pressed="${S.setor === k}">${n}${c ? `<span class="sc">${c}</span>` : ""}</button>`; }).join("");
  if (S.sup && !S.suppliers.some(x => x.id === S.sup)) S.sup = "";
  const sb = $("#supBtn"); sb.setAttribute("aria-pressed", String(!!S.sup));
  sb.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6"/></svg><span>${S.sup ? esc(shortSup(supById(S.sup).nome)) : "Fornecedores"}</span>`;
  const sm = $("#supModal"); sm.hidden = !(S.supOpen && S.view === "encomendar");
  if (!sm.hidden) {
    const cnt = id => S.products.filter(p => p.offers.some(o => o.supplier_id === id)).length;
    sm.innerHTML = `<div class="msheet" role="dialog" aria-modal="true" aria-label="Fornecedores"><header><h3>Fornecedores</h3><button class="small" data-action="sup-close">Fechar</button></header>
      <button class="sopt" data-action="sup-pick" data-s="" aria-pressed="${!S.sup}"><span>Todos os fornecedores</span><small>${S.products.length} produtos</small></button>`
      + S.suppliers.filter(x => cnt(x.id)).map(x => `<button class="sopt" data-action="sup-pick" data-s="${x.id}" aria-pressed="${S.sup === x.id}"><span>${esc(shortSup(x.nome))}</span><small>${cnt(x.id)} produtos</small></button>`).join("") + `</div>`;
  }
  const cc = $("#cntCart"); cc.hidden = !ents.length; cc.textContent = ents.length;
  bar.hidden = !ents.length || S.view === "carrinho";
  if (ents.length) { const tot = ents.reduce((t, e) => t + e.qty * e.o.pack_price, 0); $("#cartlink").innerHTML = `<span>Carrinho · ${ents.length} ${ents.length === 1 ? "artigo" : "artigos"}</span><span class="num">${eur(tot)} →</span>`; }

function render(){

    : S.view === "faturas" ? viewInvoices() : S.view === "gestao" ? viewGestao() : "";
}

    <div class="row"><button class="primary" data-action="pin-save">Guardar PIN</button><button data-action="pin-cancel">Cancelar</button></div></div>`;
}

}
function viewShop(){
  if (S.editProd) return viewProdEdit();
  const novo = "";
  if (!S.products.length) return `<div class="card empty"><h3>O catálogo ainda está vazio</h3><p class="lead">${isChefe() ? "Leia a primeira fatura de um fornecedor. A app cria os produtos com os preços." : "O chefe ainda não carregou produtos. Assim que ler as primeiras faturas, aparecem aqui."}</p>${isChefe() ? '<a class="btn primary" href="#faturas">Ler uma fatura</a>' : ""}</div>`;
  const q = norm(S.search); const showAll = S.todos || !!q;
  const bySup = p => !S.sup || p.offers.some(o => o.supplier_id === S.sup);
  const base = (showAll ? S.products : S.products.filter(inSite)).filter(bySup);
  const cats = [...new Set(base.map(p => p.categoria || "Outros"))].sort((a,b) => CATS.indexOf(a) - CATS.indexOf(b));
  if (S.cat && !cats.includes(S.cat)) S.cat = "";
  const more = q ? `<div class="row" style="margin-top:14px"></div>` : S.todos ? `<div class="row" style="margin-top:14px"><button class="small" data-action="todos">Mostrar só ${esc(setorNome(S.setor))}</button></div>`
    : `<div class="row" style="margin-top:14px"><button class="small" data-action="todos">Não encontra? Ver todos os produtos (${S.products.length})</button></div>`;
  const inCat = p => !S.cat || (p.categoria || "Outros") === S.cat;
  const match = (p, fuzzy) => {
    const hay = norm(p.nome + " " + p.categoria + " " + p.offers.map(o => o.alias).join(" ") + " " + p.offers.map(o => supById(o.supplier_id).nome).join(" "));
    const words = fuzzy ? hay.split(/[^a-z0-9]+/).filter(Boolean) : null;
    return q.split(/\s+/).every(w => hay.includes(w) || (fuzzy && w.length >= 4 && words.some(x => Math.min(lev(x, w), lev(x.slice(0, w.length), w)) <= (w.length >= 6 ? 2 : 1))));
  };
  let list = base.filter(p => inCat(p) && (!q || match(p, false)));
  let approx = false;
  if (q && !list.length) { list = base.filter(p => inCat(p) && match(p, true)); approx = list.length > 0; }
  let h = novo + `<div class="chips" role="group" aria-label="Categorias"><button class="chip" data-action="cat" data-cat="" aria-pressed="${!S.cat}">Todas</button>`
    + cats.map(c => `<button class="chip" data-action="cat" data-cat="${esc(c)}" aria-pressed="${S.cat === c}">${esc(c)}</button>`).join("") + `</div>`;
  const extra = more.replace("</div>", (isChefe() ? `<button class="small" data-action="new-prod">+ Novo produto</button>` : "") + "</div>");
  if (!list.length) return h + `<p class="muted">Nenhum produto encontrado${S.sup ? " deste fornecedor" : ""}.</p>` + extra;
  const hab = (!q && !S.cat) ? habituals() : [];
  if (hab.length) h += `<h3 class="habh">Mais pedidos</h3><div class="plist">${hab.map(prodCard).join("")}</div><h3 class="habh">Todos os produtos</h3>`;
  if (approx) h += `<p class="muted" style="margin:0 0 8px">Resultados parecidos com “${esc(S.search)}”.</p>`;
  return h + `<div class="plist">` + list.map(prodCard).join("") + `</div>` + extra;
}
function habituals(){
  const cnt = {};
  S.orders.forEach(o => { if (o.status === "rejeitada") return; const seen = new Set();
    (o.items || []).forEach(it => { if (!it.product_id || !(Number(it.qty) > 0) || seen.has(it.product_id)) return; seen.add(it.product_id); cnt[it.product_id] = (cnt[it.product_id] || 0) + 1; }); });
  return S.products.filter(p => cnt[p.id] >= 2 && inSite(p) && p.offers.length && (!S.sup || p.offers.some(o => o.supplier_id === S.sup)))
    .sort((a, b) => cnt[b.id] - cnt[a.id]).slice(0, 5);
}
const stepOf = (pq, bu) => (Number(pq) === 1 && bu && bu !== "un") ? 0.5 : 1;
const qLabel = (pq, bu) => Number(pq) !== 1 ? "emb." : (bu && bu !== "un" ? bu : "");
function stepper(key, qty, step = 1, u = ""){ return `<div class="stepper"><button data-action="dec" data-k="${esc(key)}" data-st="${step}" aria-label="Menos">−</button><input class="qin" data-k="${esc(key)}" data-st="${step}" value="${num(qty,3)}" inputmode="decimal" aria-label="Quantidade${u ? " em " + esc(u) : ""}">${u ? `<span class="qu">${esc(u)}</span>` : ""}<button data-action="inc" data-k="${esc(key)}" data-st="${step}" aria-label="Mais">+</button></div>`; }
function prodCard(p){
  const offs = [...p.offers].filter(o => !S.sup || o.supplier_id === S.sup).sort((a,b) => a.unit_price - b.unit_price); const bu = p.unidade || "un";
  if (!offs.length) return `<div class="pitem"><div class="pname">${esc(p.nome)}</div><div class="psub">Sem preços.</div></div>`;
  const keyOf = o => p.id + "|" + o.supplier_id + "|" + S.setor;
  const line = (o, main) => {
    const key = keyOf(o); const qty = S.cart[key] || 0; const s = supById(o.supplier_id);
    let ch = "";
    if (o.prev_unit_price && o.unit_price) { const d = (o.unit_price - o.prev_unit_price) / o.prev_unit_price * 100;
      if (d >= 3) ch = ` <span class="tag up">↑${num(d,0)}%</span>`; else if (d <= -3) ch = ` <span class="tag down">↓${num(-d,0)}%</span>`; }
    const isPack = Number(o.pack_qty) !== 1;
    return `<div class="pl${S.pop === key ? " pop" : ""}">${main ? `<span class="pico" aria-hidden="true">${CAT_ICON[p.categoria] || "🛒"}</span>` : ""}<div class="pinfo">${main ? `<div class="pname">${esc(p.nome)}${inSite(p) ? "" : `<span class="stag">outro sítio</span>`}${isChefe() ? `<button class="edit" data-action="edit-prod" data-p="${p.id}" aria-label="Editar ${esc(p.nome)}">✎</button>` : ""}</div>` : ""}
      <div class="psub">${isPack ? `<b>${eur(o.pack_price)}</b> emb. ${esc(num(o.pack_qty, 3))} ${esc(bu)}` : `<b>${eur(o.unit_price)}/${esc(bu)}</b>`}${ch} · ${esc(shortSup(s.nome) || "Fornecedor")}${isPack ? ` · ${eur(o.unit_price)}/${esc(bu)}` : ""}${s.minimo ? " · mín. " + eur(s.minimo) : ""}</div></div>
      ${qty ? stepper(key, qty, stepOf(o.pack_qty, bu), qLabel(o.pack_qty, bu)) : `<button class="addbtn" data-action="inc" data-k="${esc(key)}" aria-label="Adicionar ${esc(p.nome)} (${esc(s.nome || "")})">+</button>`}</div>`;
  };
  const inCart = offs.some(o => S.cart[keyOf(o)] > 0);
  let h = `<div class="pitem${inCart ? " incart" : ""}">` + line(offs[0], true);
  const others = offs.slice(1);
  if (others.length) {
    const forced = others.some(o => S.cart[keyOf(o)]); const open = forced || (S.openAlt || {})[p.id];
    if (open) h += `<div class="alt">${others.map(o => line(o, false)).join("")}</div>`;
    if (!forced) h += `<button class="more" data-action="alt" data-p="${p.id}">${open ? "Esconder" : `Mais ${others.length} ${others.length === 1 ? "fornecedor" : "fornecedores"} (desde ${eur(others[0].unit_price)}/${esc(bu)})`}</button>`;
  }
  return h + `</div>`;
}

}

function cartMin(sid, tot){
  const m = Number(supById(sid).minimo) || 0; if (!m) return "";
  const open = S.orders.filter(o => o.supplier_id === sid && (o.status === "pendente" || o.status === "aprovada")).reduce((t, o) => t + itemsTotal(o.items), 0);
  return (open ? `<small class="muted">+ ${eur(open)} já pedidos a este fornecedor</small>` : "") + minInfo(m, tot + open);
}

// ---------- orders ----------
function saudacao(d = new Date()){ const h = d.getHours(); return h >= 5 && h < 12 ? "Bom dia" : h >= 12 && h < 19 ? "Boa tarde" : "Boa noite"; }
function waMessage(o, items){
  // ao fornecedor vai o total por produto (soma dos sítios)
  const agg = [], by = {};
  items.filter(it => Number(it.qty) > 0).forEach(it => { const k = it.product_id || it.nome; if (by[k]) by[k].qty += Number(it.qty); else { by[k] = {...it, qty:Number(it.qty)}; agg.push(by[k]); } });
  const lines = agg.map(it => {
    const q = Number(it.qty), pq = Number(it.pack_qty) || 1, bu = it.base_unit || "un";
    const qs = (pq === 1 && bu !== "un") ? num(q, 3) + " " + bu : num(q, 2) + " ×";
    return "- " + qs + " " + (it.alias || it.nome) + (pq !== 1 ? " [" + num(pq, 3) + " " + bu + "]" : "") + (it.codigo ? " (ref. " + it.codigo + ")" : "");
  }).join("\n");
  let m = saudacao() + "! Encomenda do " + ((S.me && S.me.restaurante) || "restaurante") + ":\n" + lines;
  if (o.entrega) m += "\n\nEntrega: " + new Date(o.entrega + "T12:00:00").toLocaleDateString("pt-PT", {weekday:"long", day:"numeric", month:"long"});
  if (o.nota) m += "\nNota: " + o.nota;
  return m + "\n\nObrigado.";
}

function orderCard(o){

function calcUnit(l){ const p = parseNum(l.price), q = parseNum(l.packQty) || 1; return isFinite(p) && p >= 0 && q > 0 ? p / q : null; }

  if (!(ref > 0)) return null;

  if (ratio >= 2 || ratio <= 0.5) return {lvl:"odd", txt:`Preço muito diferente do habitual (${was}). Confirme o peso, a embalagem e a unidade.`};

async function loadImage(file){
  try { const b = await createImageBitmap(file); return {src:b, w:b.width, h:b.height}; }
  catch(e){ const i = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); return {src:i, w:i.naturalWidth, h:i.naturalHeight}; }
}
// melhora a foto: reduz para 1600 px, passa a cinzento e estica o contraste
async function compress(file){
  const {src, w, h} = await loadImage(file);
  const s = Math.min(1, 1600 / Math.max(w, h)); const c = document.createElement("canvas");
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  const ctx = c.getContext("2d"); ctx.drawImage(src, 0, 0, c.width, c.height);
  try {
    const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data, hist = new Uint32Array(256), n = d.length / 4;
    for (let i = 0; i < d.length; i += 4) { const g = (d[i] * 299 + d[i+1] * 587 + d[i+2] * 114) / 1000 | 0; d[i] = g; hist[g]++; }
    let lo = 0, hi = 255, acc = 0; while (lo < 255 && (acc += hist[lo]) < n * 0.02) lo++; acc = 0; while (hi > 0 && (acc += hist[hi]) < n * 0.02) hi--;
    const range = Math.max(1, hi - lo);
    for (let i = 0; i < d.length; i += 4) { const v = Math.max(0, Math.min(255, (d[i] - lo) * 255 / range)); d[i] = d[i+1] = d[i+2] = v; }
    ctx.putImageData(img, 0, 0);
  } catch(e){}
  return {type:"image/jpeg", data:c.toDataURL("image/jpeg", 0.8).split(",")[1]};
}
async function thumb(file){
  const {src, w, h} = await loadImage(file); const s = 160 / Math.max(w, h); const c = document.createElement("canvas");
  c.width = Math.round(w * s); c.height = Math.round(h * s); c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.6);
}
const toB64 = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(file); });
async function readInvoice(){
  if (!S.files.length || S.queueing) return;
  const pdfs = S.files.filter(f => f.type === "application/pdf");
  if (pdfs.some(f => f.size > 8 * 1024 * 1024)) { S.readMsg = "O PDF é demasiado grande (máximo 8 MB)."; render(); return; }
  S.queueing = true; S.readMsg = ""; render();
  try {
    const images = await Promise.all(S.files.map(async f => f.type === "application/pdf" ? {type:"application/pdf", data:await toB64(f)} : compress(f)));
    const firstImg = S.files.find(f => f.type !== "application/pdf");
    const miniatura = firstImg ? await thumb(firstImg).catch(() => "") : "";
    const r = await fetch(SB + "/functions/v1/compras-ler-fatura", {method:"POST", headers:{apikey:KEY, "Content-Type":"application/json"}, body:JSON.stringify({token:S.token, images, miniatura, mode:"fila"})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) {
      const c = j.error;
      S.readMsg = c === "sem_chave" ? "A leitura automática não está ligada: falta a chave do Gemini. Pode introduzir a fatura à mão."
        : c === "sessao_invalida" ? ERR.sessao_invalida : c === "sem_permissao" ? ERR.sem_permissao : c === "pedido_invalido" ? "Ficheiro não suportado. Use fotos (JPG/PNG) ou PDF."
        : "Não foi possível enviar. Tente outra vez.";
      if (c === "sessao_invalida") endSession(true);
    } else {
      S.previews.forEach(u => u && URL.revokeObjectURL(u)); S.files = []; S.previews = [];
      toast("Na fila. Pode fotografar a próxima fatura.");
      await loadDrafts();
    }
  } catch(e){ S.readMsg = "Sem ligação ou ficheiro inválido. Tente outra vez."; }
  finally { S.queueing = false; render(); }
}
function buildReview(res){

  return {supplierId:s ? s.id : "new", supplierName:f.nome || "", nif:nif || "", number:res.numero || "", date:/^\d{4}-\d{2}-\d{2}$/.test(res.data || "") ? res.data : todayISO(),

async function saveInvoice(){

      supplier_id: r.supplierId === "new" ? null : r.supplierId, fornecedor_nome:r.supplierName, nif:r.nif, numero:r.number, data:r.date,
      total: r.total === "" || r.total == null ? null : parseNum(r.total),

        qty:parseNum(l.qty) || 0, price:parseNum(l.price), pack_qty:parseNum(l.packQty) || 1, base_unit:l.baseUnit}))}});
    if (r.draftId) await rpc("compras_draft_delete", {p_token:S.token, p_id:r.draftId}).catch(() => {});

  const f = minimo - total;
  const bar = `<div class="pbar ${f > 0.005 ? "" : "ok"}" role="progressbar" aria-valuemin="0" aria-valuemax="${minimo}" aria-valuenow="${Math.min(total, minimo)}"><i style="width:${Math.max(0, Math.min(100, total / minimo * 100))}%"></i></div>`;
  return bar + (f > 0.005 ? `<small class="minw">Mínimo de entrega ${eur(minimo)} · faltam ${eur(f)}</small>`
    : `<small class="oki">✓ Mínimo de entrega atingido (${eur(minimo)})</small>`);
}
document.addEventListener("click", ev => { if (ev.target.id === "supModal") { S.supOpen = false; render(); } });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && S.supOpen) { S.supOpen = false; render(); } });
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-action]"); if (!b) return;
  const a = b.dataset.action;
  try {

    else if (a === "sup-close") { S.supOpen = false; render(); }

    else if (a === "todos") { S.todos = !S.todos; S.cat = ""; render(); }
    else if (a === "inc" || a === "dec") { const k = b.dataset.k; const st = Number(b.dataset.st) || 1; const q = Math.round(((S.cart[k] || 0) + (a === "inc" ? st : -st)) * 1000) / 1000;
      S.pop = null;

      else { S.cart[k] = q; if (a === "inc") { S.pop = k; try { navigator.vibrate && navigator.vibrate(8); } catch(e){} setTimeout(() => { if (S.pop === k) S.pop = null; }, 500); } saveCart(); render(); } }

    else if (a === "submit-cart") {
      b.disabled = true;
      const items = cartEntries().map(e => ({product_id:e.pid, supplier_id:e.sid, qty:e.qty, setor:e.setor}));
      const r = await rpc("compras_submit_order", {p_token:S.token, p_items:items, p_nota:val("cartnote")});

    }
    else if (a === "oq") { const o = S.orders.find(x => x.id === b.dataset.o); const items = (S.edits[o.id] || o.items).map(x => ({...x})); const it = items[+b.dataset.i]; it.qty = Math.max(0, Math.round(((Number(it.qty)||0) + Number(b.dataset.d)) * 1000) / 1000); S.edits[o.id] = items; render(); }
    else if (a === "approve" || a === "reject") {

      await rpc("compras_order_decide", {p_token:S.token, p_id:o.id, p_status:a === "approve" ? "aprovada" : "rejeitada", p_items:items, p_entrega:S.deliv[o.id] || null});
      delete S.edits[o.id]; await loadOrders(); render(); toast(a === "approve" ? "Confirmada. Envie-a ao fornecedor." : "Pedido rejeitado.");
    }
    else if (a === "approve-send") {
      b.disabled = true; const o = S.orders.find(x => x.id === b.dataset.o);

      if (!items.length) { toast("A encomenda ficou sem artigos. Rejeite-a."); b.disabled = false; return; }
      const entrega = S.deliv[o.id] || null;
      await rpc("compras_order_decide", {p_token:S.token, p_id:o.id, p_status:"aprovada", p_items:items, p_entrega:entrega});
      const msg = waMessage({...o, entrega: entrega || o.entrega}, items), ph = waPhone(o.telefone);
      delete S.edits[o.id]; await loadOrders(); render();
      if (o.via === "grupo" && navigator.share) { try { await navigator.share({text: msg}); toast("Confirmada. Depois de enviar, marque como enviada."); } catch(e){ toast("Confirmada. Toque em Partilhar no grupo para enviar."); } }
      else if (ph) { toast("Confirmada. A abrir o WhatsApp. Depois marque como enviada."); setTimeout(() => { location.href = "https://wa.me/" + ph + "?text=" + encodeURIComponent(msg); }, 700); }
      else toast("Confirmada. Falta o número do fornecedor para enviar.");
    }
    else if (a === "repeat") {
      const o = S.orders.find(x => x.id === b.dataset.o); let n = 0, miss = 0;
      (o.items || []).forEach(it => { const q = Number(it.qty) || 0; if (!(q > 0)) return; const p = it.product_id && prodById(it.product_id); const of = p && p.offers.find(x => x.supplier_id === o.supplier_id);
        if (!of) { miss++; return; } const k = p.id + "|" + o.supplier_id + "|" + (it.setor || S.setor); S.cart[k] = S.cart[k] || q; n++; });
      if (!n) { toast("Esses produtos já não estão disponíveis."); return; }
      saveCart(); location.hash = "#carrinho"; toast(n + (n === 1 ? " produto no carrinho" : " produtos no carrinho") + (miss ? " · " + miss + " já não disponíveis" : "") + ".");
    }
    else if (a === "sent") { b.disabled = true; await rpc("compras_order_decide", {p_token:S.token, p_id:b.dataset.o, p_status:"enviada", p_items:null, p_entrega:null}); await loadOrders(); render(); toast("Marcada como enviada."); }
    else if (a === "edit-prod") { S.editProd = b.dataset.p; S.confirmDel = null; S.confirmDelOff = null; render(); window.scrollTo(0, 0); }
    else if (a === "new-prod") { S.editProd = "new"; render(); window.scrollTo(0, 0); }
    else if (a === "pe-close") { S.editProd = null; render(); }
    else if (a === "pe-save") {
      const sets = [...document.querySelectorAll(".pe-set:checked")].map(x => x.value);
      if (S.editProd === "new") { const id = await rpc("compras_product_create", {p_token:S.token, p_nome:val("pe-nome"), p_categoria:val("pe-cat"), p_unidade:val("pe-un"), p_setores:sets}); await loadCatalog(); S.editProd = id; render(); toast("Produto criado. Acrescente os fornecedores e os preços."); }
      else { await rpc("compras_save_product", {p_token:S.token, p_id:S.editProd, p_nome:val("pe-nome"), p_categoria:val("pe-cat"), p_unidade:val("pe-un"), p_setores:sets}); await loadCatalog(); render(); toast("Produto guardado."); }
    }
    else if (a === "pe-del") {
      const id = S.editProd; if (S.confirmDel !== id) { S.confirmDel = id; render(); return; }
      S.confirmDel = null; await rpc("compras_delete_product", {p_token:S.token, p_id:id}); S.editProd = null; await loadCatalog(); render(); toast("Produto apagado.");
    }
    else if (a === "off-save") {
      const k = b.dataset.s; const pr = parseNum(val("op-" + k)); if (!isFinite(pr)) { toast("Preço inválido."); return; }
      await rpc("compras_offer_save", {p_token:S.token, p_product:S.editProd, p_supplier:k, p_alias:val("oa-" + k), p_codigo:val("oc-" + k), p_pack_qty:parseNum(val("oq-" + k)) || 1, p_pack_price:pr});
      await loadCatalog(); render(); toast("Preço guardado.");
    }
    else if (a === "off-del") {
      const k = b.dataset.s; if (S.confirmDelOff !== k) { S.confirmDelOff = k; render(); return; }
      S.confirmDelOff = null; await rpc("compras_offer_delete", {p_token:S.token, p_product:S.editProd, p_supplier:k}); await loadCatalog(); render(); toast("Fornecedor retirado deste produto.");
    }
    else if (a === "off-add") {
      const pr = parseNum(val("na-p")); if (!isFinite(pr)) { toast("Escreva o preço da embalagem."); return; }
      const p = prodById(S.editProd);
      await rpc("compras_offer_save", {p_token:S.token, p_product:S.editProd, p_supplier:val("na-s"), p_alias:val("na-a") || p.nome, p_codigo:"", p_pack_qty:parseNum(val("na-q")) || 1, p_pack_price:pr});
      await loadCatalog(); render(); toast("Fornecedor acrescentado.");
    }
    else if (a === "save-items") {
      b.disabled = true; const o = S.orders.find(x => x.id === b.dataset.o);
      const items = (S.edits[o.id] || o.items).filter(x => Number(x.qty) > 0);
      if (!items.length) { toast("A encomenda ficou sem produtos. Use “Apagar encomenda”."); b.disabled = false; return; }
      await rpc("compras_order_items", {p_token:S.token, p_id:o.id, p_items:items});
      delete S.edits[o.id]; await loadOrders(); render(); toast("Encomenda atualizada.");
    }
    else if (a === "undo-items") { delete S.edits[b.dataset.o]; render(); }
    else if (a === "del-order") {
      if (S.confirmDelOrder !== b.dataset.o) { S.confirmDelOrder = b.dataset.o; render(); return; }
      S.confirmDelOrder = null; b.disabled = true; await rpc("compras_cancel_order", {p_token:S.token, p_id:b.dataset.o}); delete S.edits[b.dataset.o]; await loadOrders(); render(); toast("Encomenda apagada.");
    }
    else if (a === "cancel") { b.disabled = true; await rpc("compras_cancel_order", {p_token:S.token, p_id:b.dataset.o}); await loadOrders(); render(); toast("Pedido cancelado."); }
    else if (a === "copy") {
      const pre = document.getElementById("msg-" + b.dataset.o);
      try { await navigator.clipboard.writeText(pre.textContent); toast("Mensagem copiada. Cole-a no WhatsApp do fornecedor."); }
      catch(e){ const rg = document.createRange(); rg.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); toast("Mensagem selecionada. Copie-a com o menu do telemóvel."); }
    }
    else if (a === "share") {
      const pre = document.getElementById("msg-" + b.dataset.o);
      if (navigator.share) { try { await navigator.share({text: pre.textContent}); } catch(e){ if (e && e.name !== "AbortError") toast("Não deu para partilhar. Use Copiar."); } }
      else { try { await navigator.clipboard.writeText(pre.textContent); toast("Mensagem copiada. Cole-a no grupo do fornecedor."); } catch(e){ toast("Use o botão Copiar."); } }
    }
    else if (a === "read") await readInvoice();
    else if (a === "clear-files") { S.previews.forEach(u => u && URL.revokeObjectURL(u)); S.files = []; S.previews = []; S.readMsg = ""; render(); }
    else if (a === "open-draft") { const d = S.drafts.find(x => x.id === b.dataset.d); if (d && d.resultado) { S.review = buildReview(d.resultado); S.review.draftId = d.id; render(); window.scrollTo(0, 0); } }
    else if (a === "del-draft") { b.disabled = true; await rpc("compras_draft_delete", {p_token:S.token, p_id:b.dataset.d}); await loadDrafts(); render(); }
    else if (a === "sup-add") {
      await rpc("compras_save_supplier", {p_token:S.token, p_id:null, p_nome:val("nsNome"), p_telefone:val("nsTel"), p_dias:val("nsDias"), p_nif:"", p_minimo:minVal("nsMin"), p_via:val("nsVia")});
      await loadCatalog(); render(); toast("Fornecedor adicionado.");
    }
    else if (a === "set-phone") {
      const s = supById(b.dataset.s); const tel = val("ph-" + b.dataset.o).trim(); if (!tel) { toast("Escreva o número."); return; }
      await rpc("compras_save_supplier", {p_token:S.token, p_id:s.id, p_nome:s.nome, p_telefone:tel, p_dias:s.dias || "", p_nif:s.nif || ""});
      await Promise.all([loadCatalog(), loadOrders()]); render(); toast("Número guardado em " + s.nome + ".");
    }
    else if (a === "manual") { S.review = {supplierId:"new", supplierName:"", nif:"", number:"", date:todayISO(), total:"", lines:[blankLine()]}; render(); }
    else if (a === "add-line") { S.review.lines.push(blankLine()); render(); }
    else if (a === "discard") { S.review = null; render(); }
    else if (a === "save-invoice") await saveInvoice();
    else if (a === "save-settings") { await rpc("compras_set_settings", {p_token:S.token, p_restaurante:val("setName")}); S.me.restaurante = val("setName").trim() || S.me.restaurante; render(); toast("Guardado."); }
    else if (a === "gen-pin") { const arr = new Uint32Array(1); crypto.getRandomValues(arr); document.getElementById("nuPin").value = String(arr[0] % 1000000).padStart(6, "0"); }
    else if (a === "user-add") {
      await rpc("compras_user_save", {p_token:S.token, p_id:null, p_nome:val("nuNome"), p_role:val("nuRole"), p_ativo:true, p_pin:val("nuPin"), p_setor:val("nuSetor")});
      toast("Adicionado. Dê-lhe o nome e o PIN " + val("nuPin") + "."); await loadUsers(); render();
    }
    else if (a === "user-save" || a === "user-toggle") {
      const u = S.users.find(x => x.id === b.dataset.u); const pin = a === "user-save" ? val("up-" + u.id).trim() : "";
      await rpc("compras_user_save", {p_token:S.token, p_id:u.id, p_nome:a === "user-save" ? val("un-" + u.id) : u.nome, p_role:a === "user-save" && !u.eu ? val("ur-" + u.id) : u.role, p_ativo:a === "user-toggle" ? !u.ativo : u.ativo, p_pin:pin || null, p_setor:a === "user-save" ? (val("us-" + u.id) || null) : (u.setor || null)});
      toast(pin ? "Guardado. Novo PIN: " + pin : "Guardado."); await loadUsers(); render();
    }
    else if (a === "sup-save") { const id = b.dataset.s; await rpc("compras_save_supplier", {p_token:S.token, p_id:id, p_nome:val("sn-" + id), p_telefone:val("st-" + id), p_dias:val("sd-" + id), p_nif:val("sf-" + id), p_minimo:minVal("sm-" + id), p_via:val("sv-" + id)}); await Promise.all([loadCatalog(), loadOrders()]); render(); toast("Fornecedor guardado."); }
    else if (a === "prod-save") { const id = b.dataset.p; await rpc("compras_save_product", {p_token:S.token, p_id:id, p_nome:val("pn-" + id), p_categoria:val("pc-" + id), p_unidade:val("pu-" + id)}); await loadCatalog(); render(); toast("Produto guardado."); }
    else if (a === "merge") {
      const from = b.dataset.p, into = val("pm-" + from); if (!into) { toast("Escolha o produto com que quer juntar."); return; }
      await rpc("compras_merge_products", {p_token:S.token, p_from:from, p_into:into});
      for (const k of Object.keys(S.cart)) if (k.startsWith(from + "|")) { const n = into + k.slice(from.length); S.cart[n] = (S.cart[n] || 0) + S.cart[k]; delete S.cart[k]; } saveCart();
      await loadCatalog(); render(); toast("Produtos juntados.");
    }
    else if (a === "del-prod") { if (S.confirmDel !== b.dataset.p) { S.confirmDel = b.dataset.p; render(); return; } S.confirmDel = null; await rpc("compras_delete_product", {p_token:S.token, p_id:b.dataset.p}); await loadCatalog(); render(); toast("Produto apagado."); }
    else if (a === "pin-form") { S.pinForm = true; render(); }
    else if (a === "pin-cancel") { S.pinForm = false; render(); }
    else if (a === "pin-save") { await rpc("compras_change_pin", {p_token:S.token, p_old:val("pOld"), p_new:val("pNew")}); S.pinForm = false; render(); toast("PIN alterado."); }
    else if (a === "logout") endSession(false);
  } catch(e){ toast(e.message === "rede" ? "Sem ligação à internet." : errMsg(e)); b.disabled = false; }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "search") { S.search = t.value; render(); return; }
  if (t.dataset.rv && S.review && t.tagName === "INPUT") { S.review[t.dataset.rv] = t.value; return; }
  if (t.dataset.ln != null && S.review && t.tagName === "INPUT" && t.type !== "checkbox") {
    const l = S.review.lines[+t.dataset.ln]; l[t.dataset.f] = t.value;
    const c = document.getElementById("calc-" + t.dataset.ln); if (c) c.innerHTML = calcHtml(l);
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "files") { const arr = [...t.files].slice(0, 5); S.previews.forEach(u => u && URL.revokeObjectURL(u)); S.files = arr; S.previews = arr.map(f => f.type === "application/pdf" ? null : URL.createObjectURL(f)); S.readMsg = t.files.length > 5 ? "Só os primeiros 5 ficheiros serão lidos." : ""; render(); return; }
  if (t.classList.contains("qin")) { const st = Number(t.dataset.st) || 1; let v = parseNum(t.value); if (isFinite(v) && st >= 1) v = Math.round(v); if (isFinite(v) && v > 0) { S.cart[t.dataset.k] = Math.round(v * 1000) / 1000; saveCart(); render(); } else { const prev = {...S.cart}; delete S.cart[t.dataset.k]; saveCart(); render(); undoToast("Produto retirado.", prev); } return; }
  if (t.id === "search") { const v = t.value.trim(); if (v.length >= 2) { const r = [v, ...ls.get("cf_recent", []).filter(x => x !== v)].slice(0, 6); ls.set("cf_recent", r); fillRecent(); } return; }
  if (t.dataset.deliv) { S.deliv[t.dataset.deliv] = t.value; return; }
  if (t.dataset.rv && S.review) { S.review[t.dataset.rv] = t.value; if (t.dataset.rv === "supplierId") render(); return; }
  if (t.dataset.ln != null && S.review) { const l = S.review.lines[+t.dataset.ln]; l[t.dataset.f] = t.type === "checkbox" ? t.checked : t.value; if (["productId","include","baseUnit"].includes(t.dataset.f)) render(); }
});

function fillRecent(){ const d = document.getElementById("recentSearches"); if (d) d.innerHTML = ls.get("cf_recent", []).map(x => `<option value="${esc(x)}">`).join(""); }
fillRecent();
// ---------- boot ----------
if (S.token) start(); else $("#loginView").hidden = false;
})();
